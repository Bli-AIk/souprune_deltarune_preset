name = "deltarune_preset"
version = "0.1.0"
authors = ["SoupRune Contributors"]
description = "Deltarune-style game preset for SoupRune — overworld menu views, FRE rules, and party data helpers."

# This is a library mod, not a standalone game.
# 这是一个库 mod，不是独立游戏。
entry_point = false

# Resource directories configuration
# 资源目录配置
[resources]
textures = "assets/textures"
audios = "assets/audios"
fonts = "assets/fonts"

[dependencies]
# No dependencies — this is the base Deltarune library.

[mod_library]
# Empty runtime component so dependents can load this preset without behavior hooks.
# 空 runtime 组件，用于让依赖方加载此前置而不注册行为 hook。
wasm = ".build/runtime.wasm"

[content_library]
wasm = ".build/content.wasm"

[game]
global_rules = "app/global.fre.ron"
player_behavior_path = "overworld/players/player_behavior.ron"
input_config_path = "app/input.ron"
flow_config_path = "app/flow.ron"
locales_directory = "assets/locales"
overworld_rules = [
    "overworld/rules/interaction.fre.ron",
    "overworld/rules/dark_menu.fre.ron",
]
